name: Reusable macOS build
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      tag:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Validate version
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
        run: python3 scripts/version.py check --tag "$EXPECTED_TAG"
      - name: Build universal app and run tests
        run: bash scripts/build.sh
      - name: Package ad-hoc signed DMG
        run: bash scripts/package-dmg.sh
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bongo-tap-macos
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
