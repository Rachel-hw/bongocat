name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment (default patch)
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      notes:
        description: Optional release notes (also collects CHANGELOG Unreleased)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: bongo-tap-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Bump version or validate pushed tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$REF_NAME" == main ]] || { echo 'Run a version release from main.' >&2; exit 1; }
            git checkout main
            git pull --ff-only origin main
            version="$(python3 scripts/version.py bump --part "${BUMP:-patch}")"
            tag="v$version"
            if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag already exists: $tag" >&2
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Resources/Info.plist CHANGELOG.md
            git commit -m "chore: release $tag"
            git tag -a "$tag" -m "Bongo Tap $tag"
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          else
            tag="$REF_NAME"
          fi
          python3 scripts/version.py check --tag "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  # GITHUB_TOKEN tag pushes do not trigger another push workflow. Calling the
  # reusable build here ensures automatic version releases still get packaged.
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}
      tag: ${{ needs.prepare.outputs.tag }}
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bongo-tap-macos
          path: dist
      - name: Verify checksums and prepare notes
        run: |
          (cd dist && shasum -a 256 -c ./*.sha256)
          python3 scripts/version.py notes > release-notes.md
      - name: Upload to a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "Bongo Tap $TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/*.dmg dist/*.sha256 --clobber
